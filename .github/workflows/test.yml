
name: My First Python Workflow

on:
  schedule:
    - cron: "50 12 19 10 *"

  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest 

    steps:
      - name: Download my code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Python
        run: python main.py

      - name: Upload SijanDon File
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: Sijan Don ko Json
            path: hello.json
            if-no-files-found: warn

